<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 58">
  <!-- 尻尾(座標を指す)。角丸四角の下に重ねる。色は開設状況のリングと同じ -->
  <path d="M15 44 h18 l-9 13 z" fill="{{ring}}"/>
  <!-- 状態色リング → 白フチ → 安全緑の地(JIS の避難所図記号を模す) -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="{{ring}}"/>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#ffffff"/>
  <rect x="6.5" y="6.5" width="35" height="35" rx="8" fill="#0E8A50"/>
  <g fill="#ffffff">
    <!-- 避難先を示す扉の枠 -->
    <path d="M33 13 h5 v22 h-3.2 V16.2 H33 Z"/>
    <!-- 走る人:頭と、前後に開いた腕・脚を持つ胴 -->
    <circle cx="19.5" cy="14" r="3.6"/>
    <path d="M22.4 18.2 L27.4 20.6 L26.2 23.4 L22 21.4 L21.1 25.6
             L25.2 30.2 L23.2 37.4 L19.9 36.3 L21.2 30.2 L17.4 26.3
             L12.9 29.4 L10.9 26.6 L15.6 23.2 L17.8 21.6
             L13.6 20.8 L13.9 17.9 L18.6 19 Z"/>
  </g>
</svg>
