<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- 白フチ → 深い川藍の地。過去の記録なので状態色は持たない -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="#ffffff"/>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="{{color}}"/>
  <!-- 石碑: 上が丸い碑身と台座。碑文の行を短い線で示す -->
  <g fill="#ffffff">
    <path d="M16 13a8 8 0 0 1 16 0v19H16z"/>
    <rect x="12" y="33" width="24" height="4" rx="1"/>
  </g>
  <g fill="{{color}}">
    <rect x="21" y="15" width="6" height="2" rx="1"/>
    <rect x="21" y="20" width="6" height="2" rx="1"/>
    <rect x="21" y="25" width="6" height="2" rx="1"/>
  </g>
</svg>
